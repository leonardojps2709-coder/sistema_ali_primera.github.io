<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Escolar - Redirección</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        (function() {
            try {
                const raw = sessionStorage.getItem('currentUser');
                if (raw) {
                    const cu = JSON.parse(raw);
                    if (cu && cu.rol && (cu.activo === undefined || cu.activo === null || parseInt(cu.activo) === 1)) {
                        if (cu.rol === 'superadmin') {
                            window.location.replace('superadmin/index.html');
                            return;
                        } else if (cu.rol === 'admin') {
                            window.location.replace('admin/index.html');
                            return;
                        } else if (cu.rol === 'teacher') {
                            window.location.replace('profesor/index.html');
                            return;
                        }
                    }
                }
            } catch(e) {}
            window.location.replace('login/bienvenida.html');
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Sistema Escolar</h1>
        <p>Redirigiendo al portal de acceso... Si no es redirigido automáticamente, <a href="login/bienvenida.html">haga clic aquí</a>.</p>
    </div>
</body>
</html>
